<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Infra Abogados – Prueba API</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f5f5f5;
    }
    .card {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 1.4rem;
      margin-top: 0;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.3rem;
    }
    button {
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    button.primary {
      background: #2563eb;
      color: white;
    }
    button.secondary {
      background: #e5e7eb;
      margin-left: 0.5rem;
    }
    .output {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #0f172a;
      color: #e5e7eb;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.9rem;
      max-height: 300px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status {
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    .status.ok {
      color: #16a34a;
    }
    .status.error {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Infra Abogados – Prueba de API</h1>
    <p>
      Esta página sirve solo para probar la API (healthcheck y endpoints básicos)
      cuando el backend y el API Gateway estén listos.
    </p>

    <div>
      <label>Endpoint base de la API</label>
      <input id="apiBaseUrl" type="text" style="width:100%; padding:0.4rem;"
             placeholder="https://api-dev.tu-dominio.com" />
    </div>

    <div style="margin-top:1rem;">
      <button class="primary" id="btnHealth">Probar /health</button>
      <button class="secondary" id="btnAudiencias">Probar /audiencias (mock)</button>
    </div>

    <div class="status" id="status"></div>

    <div class="output" id="output"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
